name: Render backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'

jobs:
  backend:
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o bin/deaddrop-api .
