name: DeadDrop Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build and test
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DeadDrop-debug.apk
          sha256sum release/DeadDrop-debug.apk > release/SHA256SUMS.txt

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadDrop-APK
          path: release/
          if-no-files-found: error
          retention-days: 30
